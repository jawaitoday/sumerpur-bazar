<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin | Sumerpur Bazar</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fc;font-family:system-ui,sans-serif;color:#1b2b45}header{background:#102c68;color:#fff;padding:20px}main{max-width:1100px;margin:25px auto;padding:0 15px}h1{margin:0;font-size:25px}header p{margin:5px 0 0}.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}button,select{padding:11px 15px;border-radius:9px;border:1px solid #cbd5e1;background:white;font:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.blue{background:#1757d6;color:white;border-color:#1757d6}.green{background:#16834a;color:white;border-color:#16834a}.red{background:#bd2434;color:white;border-color:#bd2434}.card{background:white;border:1px solid #dfe6f0;border-radius:15px;padding:18px;margin-bottom:13px;box-shadow:0 3px 12px #102b6510}.card h2{font-size:20px;margin:0 0 9px}.card p{margin:7px 0;overflow-wrap:anywhere}.card .buttons{display:flex;gap:9px;margin-top:15px}.muted{color:#5e6d83;font-size:13px}.price{font-weight:800;color:#0d429b}.status{font-weight:700}a{color:#1757d6}#msg{padding:10px 0}</style></head><body><header><h1>SUMERPUR BAZAR — Admin Panel</h1><p>विज्ञापन जाँचें और Approve / Reject करें</p></header><main><div class="bar"><select id="filter" aria-label="विज्ञापन स्थिति"><option value="pending">Pending</option><option value="approved">LIVE / Approved</option><option value="rejected">Rejected</option><option value="all">सभी विज्ञापन</option></select><button class="blue" id="refresh">रिफ्रेश करें</button><a href="/" style="align-self:center">वेबसाइट पर जाएँ</a></div><div id="msg" role="status">लोड हो रहा है...</div><div id="list"></div></main><script>
const list=document.getElementById('list'),msg=document.getElementById('msg'),filter=document.getElementById('filter');const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){msg.textContent='लोड हो रहा है...';list.replaceChildren();try{const r=await fetch('/api/admin?status='+encodeURIComponent(filter.value),{credentials:'same-origin',cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error||'Error');msg.textContent=(d.ads||[]).length+' विज्ञापन मिले • Admin: '+d.admin;for(const a of d.ads){const card=document.createElement('article');card.className='card';card.innerHTML='<h2>#'+Number(a.id)+' — '+safe(a.title)+'</h2><p class="price">₹'+Number(a.price).toLocaleString('en-IN')+'</p><p>📍 '+safe(a.location)+' | '+safe(a.category)+'</p><p>'+safe(a.description)+'</p><p class="muted">विक्रेता: '+safe(a.seller_name||'—')+' | '+safe(a.seller_email||'—')+' | मोबाइल: '+safe(a.phone)+'</p><p class="status">स्थिति: '+safe(a.status)+'</p>';if(a.photo_url){const im=document.createElement('img');im.src=a.photo_url;im.alt='विज्ञापन फोटो';im.style='max-width:220px;max-height:160px;object-fit:contain;display:block';card.append(im)}const buttons=document.createElement('div');buttons.className='buttons';for(const [action,label,cls] of [['approve','✓ Approve / LIVE','green'],['reject','✕ Reject','red']]){const b=document.createElement('button');b.textContent=label;b.className=cls;b.onclick=async()=>{if(!confirm('विज्ञापन #'+a.id+' '+label+' करना है?'))return;b.disabled=true;try{const r=await fetch('/api/admin',{method:'POST',headers:{'content-type':'application/json'},credentials:'same-origin',body:JSON.stringify({id:a.id,action})});const d=await r.json();if(!r.ok)throw Error(d.error||'Update failed');await load()}catch(e){alert(e.message);b.disabled=false}};buttons.append(b)}card.append(buttons);list.append(card)}if(!d.ads?.length)msg.textContent='इस स्थिति में कोई विज्ञापन नहीं मिला।'}catch(e){msg.textContent=e.message+' — वेबसाइट पर अपने अधिकृत अकाउंट से लॉगिन करें। Cloudflare में ADMIN_EMAIL भी सेट होना चाहिए।'}}filter.onchange=load;document.getElementById('refresh').onclick=load;load();
</script></body></html>

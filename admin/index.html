<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Sumerpur Bazar Admin</title><style>body{margin:0;background:#f3f6fc;color:#1b2d49;font-family:system-ui,'Noto Sans Devanagari',sans-serif}main{max-width:1050px;margin:35px auto;padding:15px}header{display:flex;align-items:center;justify-content:space-between;gap:10px}h1{font-size:25px}button,input{font:inherit;border-radius:9px;padding:11px}button{border:0;background:#1546c6;color:white;cursor:pointer}button:disabled{opacity:.5}input{border:1px solid #d4dceb;max-width:100%;width:340px}section,.card{background:white;border-radius:14px;padding:18px;margin:12px 0;box-shadow:0 4px 15px #172f4a12}.card h3{margin:0 0 8px}.muted{color:#64748b;font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.reject{background:#a65a14}.delete{background:#c42b37}.error{color:#a51624}#panel{display:none}#items{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}@media(max-width:600px){main{margin:12px auto}header{display:block}}</style></head><body><main><header><h1>SUMERPUR BAZAR — Admin</h1><a href="/" style="color:#1546c6">वेबसाइट देखें</a></header><section id="login"><h2>एडमिन लॉगिन</h2><p class="muted">Cloudflare में सेट किया गया ADMIN_TOKEN यहाँ डालें।</p><form id="loginForm"><input id="token" type="password" required minlength="24" autocomplete="off" placeholder="Admin secret token"><button>लॉगिन</button></form></section><section id="panel"><header><h2>विज्ञापन प्रबंधन</h2><button id="logout">लॉगआउट</button></header><p class="muted">Approve करने पर विज्ञापन सार्वजनिक होगा। Delete स्थायी रूप से हटाएगा।</p><button id="refresh">रिफ्रेश</button><div id="items"></div></section><p id="message" role="status"></p></main><script>
let token='';const $=id=>document.getElementById(id);const msg=(s,err=false)=>{const el=$('message');el.textContent=s;el.className=err?'error':''};
async function call(method='GET',data){const r=await fetch('/api/admin/ads',{method,headers:{'authorization':'Bearer '+token,...(data?{'content-type':'application/json'}:{})},body:data?JSON.stringify(data):undefined,cache:'no-store'});let result;try{result=await r.json()}catch{throw Error('सर्वर से सही जवाब नहीं आया')}if(!r.ok)throw Error(result.error||'सर्वर त्रुटि');return result}
function element(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=String(text);if(cls)e.className=cls;return e}
async function load(){msg('लोड हो रहा है...');try{const data=await call();$('login').style.display='none';$('panel').style.display='block';const root=$('items');root.replaceChildren();for(const a of data.ads){const card=element('div',undefined,'card');card.append(element('h3',a.title),element('div','₹'+Number(a.price).toLocaleString('en-IN')+' • '+a.location),element('p',a.description),element('p','ID: '+a.id+' | '+a.status,'muted'),element('p','संपर्क: '+a.phone,'muted'));const actions=element('div',undefined,'actions');for(const [action,label,cls] of [['approve','Approve',''],['reject','Reject','reject'],['delete','Delete','delete']]){const b=element('button',label,cls);b.onclick=async()=>{if(action==='delete'&&!confirm('यह विज्ञापन हमेशा के लिए हटाएँ?'))return;b.disabled=true;try{await call('POST',{id:a.id,action});await load();msg('बदलाव सेव हो गया')}catch(e){msg(e.message,true);b.disabled=false}};actions.append(b)}card.append(actions);root.append(card)}if(!data.ads.length)root.append(element('p','अभी कोई विज्ञापन नहीं है।'));msg('कुल '+data.ads.length+' विज्ञापन')}catch(e){msg(e.message,true);if(e.message.includes('अनुमति')){$('panel').style.display='none';$('login').style.display='block'}}}
$('loginForm').onsubmit=e=>{e.preventDefault();token=$('token').value;$('token').value='';load()};$('refresh').onclick=load;$('logout').onclick=()=>{token='';$('panel').style.display='none';$('login').style.display='block';$('items').replaceChildren();msg('लॉगआउट हो गया')};
</script></body></html>
